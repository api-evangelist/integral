name: Integral
description: 'Integral (Integral Development Corp.) is a technology provider for institutional
  currency and digital-asset trading. Its cloud-native, API-first platform delivers liquidity
  aggregation, execution management, pricing engines, distribution, risk management, settlement,
  and market data across foreign exchange, CFDs, precious metals, and crypto. Integral serves
  banks, institutional and retail brokers, precious-metals businesses, and crypto trading firms,
  and is SOC 2 Type II certified with connectivity over FIX, ITCH, and proprietary REST and
  WebSocket APIs. Surfaced as a portfolio company of Accel, Electric Capital, and General Catalyst.'
